<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#0f4c5c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InvestHer — учимся инвестировать</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#16292b;--mut:#5d6e6f;--line:#e0e5e3;--pri:#0f4c5c;--pri2:#e3eef0;--gold:#b88a1e;--ok:#2f7d5b;--okbg:#e6f3ec;--bad:#a8402f;--badbg:#f8e9e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1819;--card:#17252a;--ink:#e6eeee;--mut:#9bb0b1;--line:#2a3b3f;--pri:#6fc0d2;--pri2:#1c3237;--gold:#e0b64d;--ok:#6fcf9f;--okbg:#17332a;--bad:#f09a8a;--badbg:#3a211d}}
:root[data-theme="dark"]{--bg:#0f1819;--card:#17252a;--ink:#e6eeee;--mut:#9bb0b1;--line:#2a3b3f;--pri:#6fc0d2;--pri2:#1c3237;--gold:#e0b64d;--ok:#6fcf9f;--okbg:#17332a;--bad:#f09a8a;--badbg:#3a211d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;line-height:1.25;margin:0 0 .5em;font-weight:600}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em;max-width:68ch}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;min-height:100dvh}
nav{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:24px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--card)}
.logo{font-family:Georgia,serif;font-size:1.25rem;font-weight:700;color:var(--pri);padding:0 10px 18px}
nav a{padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on{background:var(--pri2);color:var(--pri)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
main{padding:28px;max-width:860px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}
.mut{color:var(--mut);font-size:.92rem}
.btn{display:inline-block;border:0;background:var(--pri);color:var(--card);padding:10px 18px;border-radius:8px;font:600 .95rem inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.big{font-family:Georgia,serif;font-size:1.9rem;font-weight:600}
.tag{display:inline-block;font-size:.8rem;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:6px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.exp{padding:10px 14px;border-radius:8px;margin:8px 0;font-size:.95rem}.exp.ok{background:var(--okbg)}.exp.bad{background:var(--badbg)}
label{display:block;font-size:.9rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.key{border-left:3px solid var(--gold);padding:6px 0 6px 14px;margin:14px 0}
.note{font-size:.85rem;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tabs .btn{flex:1 1 auto;padding:10px 12px}button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}.opt,nav a{min-height:44px}input,select{font-size:16px}.btn{min-height:44px}
.err{color:var(--bad);font-weight:500}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.lrow:first-of-type{border-top:0}
svg{width:100%;height:auto;display:block}
.chk{color:var(--ok);font-weight:700}
@media (max-width:859px){#app{display:block;padding-bottom:70px}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:5}
.logo{display:none}nav a{flex:1 0 auto;white-space:nowrap;padding:8px 3px;font-size:.7rem;text-align:center;display:flex;align-items:center;justify-content:center}nav::-webkit-scrollbar{display:none}main{padding:18px 16px}}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const FRO=["Тревожный признак","Выглядит нормально"];
const FR=[
{t:"«Гарантируем 15% в месяц. Мест ограничено, решайте сегодня»",a:0,e:"Два признака сразу: гарантия очень высокого дохода и спешка. Настоящие инвестиции дохода не гарантируют, и торопить вас не должны."},
{t:"Брокер из реестра лицензированных, комиссия 0,3% за сделку, в договоре описаны риски",a:1,e:"Есть лицензия, прозрачные комиссии и честное предупреждение о рисках. Это нормальные признаки, но даже так лицензию нужно проверить самому."},
{t:"Незнакомец в мессенджере предлагает «инсайдерскую» сделку и просит перевести деньги на личную карту",a:0,e:"Легальные сделки идут через брокерский счёт, а не на личную карту незнакомца. Инсайд также может быть незаконным."},
{t:"Банк с лицензией предлагает вклад, ставка близка к рыночной, условия и страхование прописаны в договоре",a:1,e:"Ставка близка к рыночной, условия прозрачны. Уточните в банке условия страхования, у него есть лимит."},
{t:"«Наш робот не ошибается. Заработал 300% за квартал, вот скриншоты счетов»",a:0,e:"Скриншоты легко подделать, а «не ошибается» противоречит основам рынка."},
{t:"«Чтобы вывести прибыль, сначала оплатите налог на наш счёт»",a:0,e:"Налоги и комиссии не оплачивают переводом на частный счёт «для вывода». Это классическая схема вымогательства."},
{t:"Фонд сообщает, что в прошлом году доходность была 9%, и напоминает, что это не гарантия будущего",a:1,e:"Честный подход: факт из прошлого отделён от обещаний на будущее. Стоит проверить цифры в официальных документах."},
{t:"«Приведи троих друзей, получи бонус. Деньги новых участников платят вам»",a:0,e:"Это признак финансовой пирамиды: доход выплачивается за счёт новых взносов, а не прибыли. В конце схема обрушивается."},
{t:"Вас просят назвать код из СМС и пароль от брокерского приложения «для проверки»",a:0,e:"Настоящий брокер никогда не просит пароли и коды. Полностью прекратите разговор и перезвоните по официальному номеру."},
{t:"Компания публикует отчётность и лицензию, менеджер не торопит и предлагает сначала прочитать документы",a:1,e:"Прозрачность и отсутствие давления — хорошие признаки, но лицензию всё равно нужно проверить на сайте регулятора."}];
const LESSONS=[
{t:"Деньги и инфляция",lv:1,goal:"Понять, почему деньги «под подушкой» со временем дешевеют.",
 p:["Покупательная способность — это то, сколько товаров и услуг вы можете купить на свои деньги. Инфляция — общий рост цен. Если цены растут, на те же деньги вы покупаете меньше.","Инфляция в 7% в год означает, что через 10 лет вещи, стоившие 100 000, будут стоить около 197 000. Ваши 100 000 никуда не делись, но купить на них можно примерно вдвое меньше."],
 life:"Батон хлеба три года назад стоил 35, сейчас 50. Те же 100 монет в кошельке «стали» меньше хлеба.",
 inv:"Вклад даёт 8% в год, инфляция 10%. Номинально сумма растёт, но реальная доходность отрицательна: примерно −1,8% (1,08 / 1,10 − 1).",
 key:["Номинальная доходность — то, что написано в договоре; реальная — с поправкой на инфляцию.","Хранение больших сумм наличными надолго снижает покупательную способность."],
 q:[{q:"Цены выросли на 10%, а ваш счёт — на 6%. Что произошло с покупательной способностью?",o:["Выросла","Снизилась","Не изменилась"],a:1,e:"Деньги выросли медленнее цен, поэтому купить на них можно меньше. Сравнивайте доходность всегда с инфляцией."},
 {q:"Что такое реальная доходность?",o:["Доходность с поправкой на инфляцию","Доходность без комиссий","Гарантированная доходность"],a:0,e:"Реальная доходность показывает, насколько выросла именно покупательная способность, а не цифра на счёте."},
 {q:"Какой вывод верен при инфляции 8% в год?",o:["100 000 через 5 лет купят столько же, сколько сейчас","100 000 через 5 лет купят заметно меньше","Инфляция влияет только на продукты"],a:1,e:"За 5 лет цены вырастут примерно в 1,47 раза, значит те же деньги купят около 68% от нынешнего."}],
 task:"Посмотрите на чеки за прошлый год и за этот. Выберите три товара и посчитайте, на сколько процентов выросла их цена. Сравните с инфляцией в калькуляторе."},
{t:"Сложный процент",lv:1,goal:"Понять, почему время — главный помощник инвестора.",
 p:["Простой процент начисляется только на вложенную сумму. Сложный — ещё и на ранее начисленный доход: «проценты на проценты».","Сначала разница почти незаметна, но с годами кривая становится круче. Поэтому важно начинать раньше и не прерывать накопление без нужды."],
 life:"Снежный ком: сначала он маленький, а чем больше снега налипло, тем больше налипает каждый оборот.",
 inv:"100 000 при 8% в год за 20 лет дадут около 466 000 при сложном проценте и 260 000 при простом. Это гипотетический расчёт, а не обещание.",
 key:["Результат зависит от суммы, срока и доходности; срок часто важнее всего.","Комиссии тоже «сложатся» и со временем заметно уменьшат итог."],
 q:[{q:"Чем сложный процент отличается от простого?",o:["Начисляется и на прежний доход","Всегда выше на 2%","Работает только в банке"],a:0,e:"Доход добавляется к базе, и следующий процент считается уже с большей суммы."},
 {q:"Что сильнее всего усиливает эффект сложного процента?",o:["Долгий срок","Частые проверки котировок","Сложные термины"],a:0,e:"Эффект растёт нелинейно: чем дольше срок, тем круче рост."},
 {q:"Доходность 8% в год в расчёте — это…",o:["Гарантия","Допущение для примера","Средняя доходность всех акций"],a:1,e:"Реальная доходность неизвестна заранее и может быть как выше, так и ниже, в том числе отрицательной."}],
 task:"Откройте калькулятор сложного процента. Сравните 20 и 30 лет при одинаковых взносах. Запишите, насколько вырос итог."},
{t:"Накопления, подушка и инвестиции",lv:1,goal:"Отличать накопления от инвестиций и понять, зачем нужна финансовая подушка.",
 p:["Накопления — деньги, которые нужно сохранить и иметь под рукой. Инвестиции — деньги, которые вы готовы вложить на срок и пережить временные падения ради возможного дохода.","Финансовая подушка — запас на 3–6 месяцев обязательных расходов на надёжном и доступном счёте. Это не инвестиция, а защита от неожиданностей. Сначала подушка, потом инвестиции."],
 life:"Сломалась стиральная машина. Если подушка есть, вы платите из неё. Если нет, придётся продавать активы, возможно, в неудачный момент.",
 inv:"Деньги, которые понадобятся через год, нельзя вкладывать в акции: за год рынок может упасть, а ждать восстановления времени не будет.",
 key:["Горизонт до 1–3 лет — повод для надёжных инструментов, а не для рискованных.","Инвестируйте только свободные деньги."],
 q:[{q:"Деньги понадобятся на ремонт через 8 месяцев. Что разумнее?",o:["Вложить в акции одной компании","Держать в надёжном доступном инструменте","Взять кредит и вложить"],a:1,e:"Короткий срок плохо сочетается с колебаниями рынка. Важнее сохранность и доступность."},
 {q:"Для чего нужна финансовая подушка?",o:["Для максимальной доходности","Для покрытия непредвиденных расходов","Для налогового вычета"],a:1,e:"Подушка защищает от вынужденной продажи активов в плохой момент."},
 {q:"Ежемесячные обязательные расходы — 60 000. Ориентир подушки на 4 месяца?",o:["60 000","240 000","600 000"],a:1,e:"60 000 × 4 = 240 000."}],
 task:"Выпишите обязательные ежемесячные расходы и умножьте на 3 и на 6. Получится ваш ориентир подушки."},
{t:"Риск и доходность",lv:1,goal:"Понять, почему высокая потенциальная доходность связана с риском потерь.",
 p:["Риск — это возможность получить результат хуже ожидаемого, включая убыток. Обычно чем выше возможная доходность, тем выше неопределённость.","Если вам обещают высокий доход без риска, это главный признак мошенничества или непонимания. Гарантий в инвестициях нет, кроме тех, которые прямо закреплены условиями конкретного продукта."],
 life:"Работа с фиксированным окладом и работа только на проценты: во втором случае доход потенциально выше, но стабильности меньше.",
 inv:"Акции в среднем за долгий срок могли приносить больше, чем облигации, но за отдельные годы теряли 20–40% и более. Прошлые результаты не гарантируют будущих.",
 key:["Риск нельзя убрать полностью, его можно понимать и ограничивать.","Подозрительны обещания «20% в месяц без риска»."],
 q:[{q:"Вам обещают 5% в неделю гарантированно. Ваши действия?",o:["Вложить немного для пробы","Считать это тревожным признаком","Вложить всё, пока предложение действует"],a:1,e:"Гарантированная очень высокая доходность — типичный признак мошенничества. Проверьте лицензию организации."},
 {q:"Что верно?",o:["Прошлая доходность гарантирует будущую","Высокая возможная доходность обычно связана с высоким риском","Риск бывает только у акций"],a:1,e:"Рынок платит за готовность принять неопределённость."},
 {q:"Что значит «риск» в инвестициях?",o:["Только вероятность потерять всё","Неопределённость результата, в том числе возможный убыток","Комиссия брокера"],a:1,e:"Риск шире, чем полная потеря: это отклонение результата от ожидаемого."}],
 task:"Найдите в интернете рекламу «выгодных» вложений. Выпишите, какие признаки мошенничества вы видите."},
{t:"Акции и облигации",lv:2,goal:"Понять, чем отличаются два основных вида ценных бумаг.",
 p:["Акция — доля в компании. Вы можете заработать на росте цены и дивидендах, но компания может и подешеветь. Облигация — долговая расписка: вы одолжили деньги эмитенту, он обязуется платить купоны и вернуть сумму в срок.","Облигации обычно колеблются меньше, но тоже имеют риски: эмитент может не расплатиться, а цена зависит от процентных ставок."],
 life:"Акция похожа на долю в кофейне: заработает кофейня — получите часть прибыли. Облигация — вы одолжили кофейне деньги под проценты.",
 inv:"Купон облигации — регулярные выплаты, дивиденд по акции — часть прибыли, которую компания решает выплатить; он не гарантирован.",
 key:["Акция — доля, облигация — долг.","Дивиденды не гарантированы, купоны определены условиями выпуска (при отсутствии дефолта)."],
 q:[{q:"Что получает владелец облигации?",o:["Долю в управлении компанией","Купоны и возврат номинала в срок","Гарантированный рост цены"],a:1,e:"Облигация — долг. Платежи определены условиями, но зависят от надёжности эмитента."},
 {q:"Дивиденды по акции…",o:["Гарантированы","Решаются компанией и могут не выплачиваться","Всегда выше купонов"],a:1,e:"Компания может сократить или отменить дивиденды."},
 {q:"Что часто сильнее колеблется в цене?",o:["Акции","Банковский вклад","Деньги на счёте"],a:0,e:"Акции чаще демонстрируют более высокую волатильность, чем вклады и облигации."}],
 task:"Выберите знакомую компанию и выясните, платит ли она дивиденды. Это учебное упражнение, не рекомендация."},
{t:"Биржа и брокер",lv:2,goal:"Понять, как обычный человек покупает ценные бумаги и что такое спред.",
 p:["Биржа — организованная площадка, где встречаются покупатели и продавцы. Напрямую на ней торгуют не вы, а брокер — лицензированный посредник. Вы открываете брокерский счёт, пополняете его и отдаёте поручение.","У бумаги есть цена покупки (спрос предлагает меньше) и цена продажи (предложение просит больше). Разница между ними — спред, это скрытая плата за сделку. Кроме неё брокер берёт комиссии."],
 life:"Рынок овощей: фермер продаёт дороже, чем готов заплатить оптовик. Разница остаётся посреднику.",
 inv:"Бумага: покупка 100,00, продажа 99,80. Спред 0,20 (0,2%). Купив и тут же продав, вы потеряете эту разницу и комиссии.",

function simV(m){let sv=S.sim;
 if(!sv){m.innerHTML=`<h1>Симулятор рынка</h1><div class="card"><b>Это учебная симуляция.</b> Активы и цены вымышлены: это не реальные котировки и не прогноз. Реальных сделок здесь нет и не будет.</div><div class="card"><label for="sf">Комиссия брокера за сделку, %</label><input id="sf" value="0.3" inputmode="decimal"><p class="mut">Старт: ${fmt(100000)} виртуальных денег, срок 60 месяцев. Выберите сценарий:</p>${Object.entries(SC).map(([k,v])=>`<button class="opt" data-k="${k}">${v}</button>`).join("")}<p id="se" class="err"></p></div>`;
  m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const f=num("sf");if(isNaN(f)||f<0||f>5){$("#se").textContent="Комиссия должна быть числом от 0 до 5.";return}
   S.sim={k:b.dataset.k,t:0,cash:100000,pos:{},hist:[],vals:[100000],fee:f,paid:0};save();simV(m)});return}
 const P=prices(sv.k),t=sv.t,px=(i,tt=t)=>Math.round(P[i][tt]*100)/100;
 const V=tt=>sv.cash+SA.reduce((s,a,i)=>s+(sv.pos[a[0]]||0)*px(i,tt),0),val=V(t);sv.vals[t]=val;
 const pnl=val-100000,vs=sv.vals,lo=Math.min(...vs),hi=Math.max(...vs),sp=hi-lo||1;
 const line=vs.map((v,i)=>(i?"L":"M")+(10+i/60*300).toFixed(1)+" "+(140-(v-lo)/sp*120).toFixed(1)).join("");
 m.innerHTML=`<h1>Симулятор рынка</h1><p class="note" style="margin:0 0 12px">Учебная симуляция: сценарий «${SC[sv.k]}», вымышленные активы, не реальные котировки.</p>
 <div class="row"><div class="card"><div class="mut">Месяц</div><div class="big">${t}/60</div></div><div class="card"><div class="mut">Стоимость портфеля</div><div class="big">${fmt(val)}</div><div class="${pnl>=0?"chk":"err"}">${pnl>=0?"+":"−"}${fmt(Math.abs(pnl))} (${pct(pnl/1000)})</div></div><div class="card"><div class="mut">Свободные деньги</div><div class="big">${fmt(sv.cash)}</div><div class="mut">Комиссий уплачено: ${fmt(sv.paid)}</div></div></div>
 <div id="sm" class="${simMsg.startsWith("✓")?"chk":"err"}">${simMsg}</div>
 ${SA.map((a,i)=>{const q=sv.pos[a[0]]||0,ch=t?px(i)/px(i,t-1)-1:0;return`<div class="card"><div class="row" style="justify-content:space-between"><b style="flex:2">${a[1]}</b><span style="flex:1">${px(i).toFixed(2).replace(".",",")} ${cur()} <span class="${ch>=0?"chk":"err"}">${t?(ch>=0?"+":"−")+pct(Math.abs(ch)*100):""}</span></span></div><p class="mut">В портфеле: ${q} шт. на ${fmt(q*px(i))}</p><div class="row"><input id="q${a[0]}" value="1" inputmode="numeric" aria-label="Количество" style="flex:1 1 80px"><button class="btn" data-a="${i}" data-s="b">Купить</button><button class="btn ghost" data-a="${i}" data-s="s">Продать</button></div></div>`}).join("")}
 <div class="row"><button class="btn" id="n1" ${t>=60?"disabled":""}>Следующий месяц</button><button class="btn ghost" id="n12" ${t>=60?"disabled":""}>+12 месяцев</button></div>
 ${t>=60?`<div class="card"><b>Симуляция завершена.</b> Итог: ${fmt(val)}. Результат относится только к этому вымышленному сценарию и ничего не говорит о будущем реальных рынков.</div>`:""}
 <div class="card"><h3>Стоимость портфеля</h3><svg viewBox="0 0 320 150" role="img" aria-label="График портфеля"><path d="${line}" fill="none" stroke="var(--pri)" stroke-width="2.5"/></svg><p class="mut">От ${fmt(lo)} до ${fmt(hi)}</p></div>
 <div class="card"><h3>История операций</h3>${sv.hist.length?sv.hist.slice(-10).reverse().map(h=>`<div class="mut">Мес. ${h.t} · ${h.s} · ${h.a} · ${h.q} шт. × ${h.p.toFixed(2).replace(".",",")} · комиссия ${fmt(h.f)}</div>`).join(""):'<p class="mut">Операций пока нет. Купите что-нибудь или просто перейдите к следующему месяцу.</p>'}</div>
 <button class="btn ghost" id="rs2">Начать заново</button><p class="note">Попробуйте: купить только акции в сценарии падения, а потом сравнить с набором из нескольких активов. Так видна диверсификация.</p>`;
 m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const i=+b.dataset.a,a=SA[i],qs=$("#q"+a[0]).value.trim(),q=Number(qs),buy=b.dataset.s==="b";
  if(!/^\d+$/.test(qs)||q<1||q>1e6){simMsg="Введите целое количество от 1.";return simV(m)}
  const cost=q*px(i),fee=cost*sv.fee/100,own=sv.pos[a[0]]||0;
  if(buy){if(cost+fee>sv.cash+1e-9){simMsg="Не хватает свободных денег: нужно "+fmt(cost+fee)+" с комиссией.";return simV(m)}sv.cash-=cost+fee;sv.pos[a[0]]=own+q}
  else{if(q>own){simMsg="В портфеле только "+own+" шт.";return simV(m)}sv.cash+=cost-fee;sv.pos[a[0]]=own-q}
  sv.paid+=fee;sv.hist.push({t,s:buy?"Покупка":"Продажа",a:a[1],q,p:px(i),f:fee});simMsg="✓ "+(buy?"Куплено":"Продано")+": "+a[1]+", "+q+" шт.";save();simV(m)});
 const adv=n=>{simMsg="";for(let k=0;k<n&&sv.t<60;k++){sv.t++;sv.vals[sv.t]=V(sv.t)}save();simV(m)};
 $("#n1").onclick=()=>adv(1);$("#n12").onclick=()=>adv(12);
 $("#rs2").onclick=()=>{if(confirm("Начать симуляцию заново? Текущий виртуальный портфель будет удалён.")){S.sim=null;simMsg="";save();simV(m)}}}
function gloss(){const m=$("#main");m.innerHTML=`<h1>Словарь инвестора</h1><input id="gq" placeholder="Найти термин" aria-label="Поиск по словарю"><div class="tabs" style="margin-top:12px"><button class="btn" id="ga">Все</button><button class="btn ghost" id="gf">Избранное</button></div><div id="gl"></div>`;
 let fav=false,open=null;const draw=()=>{const x=$("#gq").value.toLowerCase();const it=TERMS.filter(t=>(!fav||S.fav[t[0]])&&(t[0]+t[1]+t[2]).toLowerCase().includes(x));
 $("#gl").innerHTML=it.length?it.map(t=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="flex:1">${t[0]}</h3><button class="btn ghost" data-f="${t[0]}" style="flex:0 0 auto">${S.fav[t[0]]?"★ В избранном":"☆ В избранное"}</button></div><p>${t[1]}</p><button class="btn ghost" data-o="${t[0]}">${open===t[0]?"Свернуть":"Подробнее"}</button>${open===t[0]?`<p style="margin-top:12px">${t[2]}</p><p><b>Пример:</b> ${t[3]}</p><p><b>Ошибка новичка:</b> ${t[4]}</p><p><b>Связанные:</b> ${t[5].split("|").map(r=>`<a href="#gloss" data-r="${r}">${r}</a>`).join(", ")}</p>`:""}</div>`).join(""):`<p class="mut">${fav?"В избранном пока пусто. Нажмите «В избранное» у нужного термина.":"Ничего не найдено. Попробуйте другое слово."}</p>`;
 $("#gl").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f;S.fav[k]?delete S.fav[k]:S.fav[k]=1;save();draw()});
 $("#gl").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{open=open===b.dataset.o?null:b.dataset.o;draw()});
 $("#gl").querySelectorAll("[data-r]").forEach(a=>a.onclick=e=>{e.preventDefault();$("#gq").value=a.dataset.r;open=a.dataset.r;fav=false;draw()})};
 $("#gq").oninput=draw;$("#ga").onclick=()=>{fav=false;$("#ga").className="btn";$("#gf").className="btn ghost";draw()};$("#gf").onclick=()=>{fav=true;$("#gf").className="btn";$("#ga").className="btn ghost";draw()};draw()}
function me(m){const n=doneN(),sc=Object.values(S.done),avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):0;
 m.innerHTML=`<h1>Мой прогресс</h1><div class="row"><div class="card"><div class="big">${n}/${LESSONS.length}</div><div class="mut">уроков пройдено</div></div><div class="card"><div class="big">${n?avg+"%":"—"}</div><div class="mut">средний результат тестов</div></div></div>
 <div class="card"><h3>Темы</h3>${LESSONS.map((L,i)=>`<a class="lrow" href="#lesson-${i}"><span>${L.t}</span><span class="${i in S.done?(S.done[i]>=70?"chk":"err"):"mut"}">${i in S.done?(S.done[i]>=70?"освоено ":"повторить ")+S.done[i]+"%":"не пройдено"}</span></a>`).join("")}</div>
 <div class="card"><h3>История</h3>${S.hist.length?S.hist.slice(-8).reverse().map(h=>`<div class="mut">${new Date(h.t).toLocaleDateString("ru-RU")} · ${LESSONS[h.id].t} · ${h.s}%</div>`).join(""):'<p class="mut">История появится после первого теста.</p>'}</div>
 <div class="card"><h3>Настройки</h3><div class="row"><button class="btn ghost" id="th">Сменить тему</button><button class="btn ghost" id="rs">Сбросить все данные</button></div><p class="note">Данные хранятся только в этом браузере. На других устройствах их не будет, а при очистке браузера они пропадут.</p></div>`;
 $("#th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme==="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);d.dataset.theme=dk?"light":"dark"};
 $("#rs").onclick=()=>{if(confirm("Удалить весь прогресс и настройки? Это действие нельзя отменить.")){try{localStorage.removeItem(KEY)}catch(e){}S={p:{},done:{},hard:{},fav:{},hist:[]};ls={};location.hash="start";route()}}}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});route();
</script>
</body>
